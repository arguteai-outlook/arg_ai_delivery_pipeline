version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: arg_ai_postgres
    environment:
      POSTGRES_DB: arg_ai
      POSTGRES_USER: arg_ai
      POSTGRES_PASSWORD: arg_ai
    ports:
      - "5432:5432"
    volumes:
      - arg_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arg_ai -d arg_ai"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  arg_ai_pgdata:
    name: arg_ai_pgdata
    