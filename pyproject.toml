[project]
name = "arg_ai"
version = "26.1.21.1"
description = "Minimal-Human AI Delivery Pipeline MVP/POC"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]==3.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
